use_default_settings:
  engines:
    keep_only:
      - bing
      - duckduckgo
      - wikipedia

general:
  debug: false
  instance_name: "openclaw-searxng"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  public_instance: false
  secret_key: "change-this-secret-before-production"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 20.0
  max_request_timeout: 30.0
  extra_proxy_timeout: 10
  enable_http2: false

engines:
  - name: bing
    disabled: false
    timeout: 20.0
    enable_http2: false

  - name: duckduckgo
    disabled: false
    timeout: 20.0
    enable_http2: false

  - name: wikipedia
    disabled: false
    timeout: 20.0
    enable_http2: false
